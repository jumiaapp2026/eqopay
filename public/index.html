<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EQOPAY STK Push Bot</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }
    h1 { margin: 0 0 6px; font-size: 1.35rem; }
    p.sub { margin: 0 0 18px; color: var(--muted); font-size: 0.9rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: #cbd5e1; }
    textarea, input {
      width: 100%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      margin-bottom: 14px;
    }
    textarea:focus, input:focus { outline: 2px solid var(--primary); border-color: transparent; }
    .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    .actions { display: flex; gap: 12px; }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .btn-start { background: var(--primary); color: #06281e; }
    .btn-start:hover { background: var(--primary-hover); }
    .btn-stop { background: var(--danger); color: #fff; }
    .btn-stop:hover { background: var(--danger-hover); }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }
    .badge {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.78rem;
    }
    .badge-idle { background: #334155; color: #cbd5e1; }
    .badge-run { background: #065f46; color: #6ee7b7; }
    .log-box {
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      height: 280px;
      overflow-y: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.8rem;
      line-height: 1.5;
    }
    .log-ERROR { color: #f87171; }
    .log-SUCCESS { color: #34d399; }
    .log-INFO { color: #93c5fd; }
    .alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>EQOPAY STK Push Dispatcher</h1>
      <p class="sub">Dispatches 1 STK Push every 5 seconds. Numbers must start with <strong>254</strong> (e.g., 254712345678).</p>

      <div id="alertBox" class="alert"></div>

      <label for="numbers">Mobile Numbers (one per line or comma-separated, starting with 254)</label>
      <textarea id="numbers" rows="6" placeholder="254712345678&#10;254722000000&#10;254110123456"></textarea>

      <div class="row">
        <div>
          <label for="amount">Amount (KES)</label>
          <input id="amount" type="number" min="1" value="100" />
        </div>
        <div>
          <label for="referencePrefix">Reference Prefix</label>
          <input id="referencePrefix" type="text" value="ORDER" />
        </div>
        <div>
          <label for="accountNumber">Account No. (Paybill only)</label>
          <input id="accountNumber" type="text" placeholder="Optional" />
        </div>
      </div>

      <div class="actions">
        <button class="btn-start" onclick="startBot()">Start 5s Queue</button>
        <button class="btn-stop" onclick="stopBot()">Stop & Clear Queue</button>
      </div>
    </div>

    <div class="card">
      <div class="status-bar">
        <div>
          Status: <span id="statusBadge" class="badge badge-idle">IDLE</span>
          &nbsp;|&nbsp; Remaining in queue: <strong id="queueCount">0</strong>
        </div>
        <span style="color: var(--muted); font-size: 0.8rem;">Mirrors Render Logs</span>
      </div>
      <div id="logBox" class="log-box">Waiting for activity...</div>
    </div>
  </div>

  <script>
    function showAlert(msg) {
      const box = document.getElementById("alertBox");
      if (!msg) {
        box.style.display = "none";
        return;
      }
      box.textContent = msg;
      box.style.display = "block";
    }

    async function startBot() {
      showAlert("");
      const rawText = document.getElementById("numbers").value;
      const amount = document.getElementById("amount").value;
      const referencePrefix = document.getElementById("referencePrefix").value;
      const accountNumber = document.getElementById("accountNumber").value;

      const parsed = rawText
        .split(/[\n,;]+/)
        .map((n) => n.trim().replace(/^\+/, ""))
        .filter(Boolean);

      if (parsed.length === 0) {
        showAlert("Enter at least one mobile number starting with 254.");
        return;
      }

      const invalid = parsed.filter((n) => !/^254(7|1)\d{8}$/.test(n));
      if (invalid.length > 0) {
        showAlert(
          `Invalid format detected: ${invalid.join(", ")}. All numbers must be 12 digits starting with 254 (e.g., 254712345678).`
        );
        return;
      }

      try {
        const res = await fetch("/api/enqueue", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            numbers: parsed,
            amount,
            referencePrefix,
            accountNumber,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          showAlert(data.error || "Failed to enqueue numbers.");
        } else {
          document.getElementById("numbers").value = "";
          refreshStatus();
        }
      } catch (err) {
        showAlert("Network error reaching server: " + err.message);
      }
    }

    async function stopBot() {
      await fetch("/api/stop", { method: "POST" });
      refreshStatus();
    }

    async function refreshStatus() {
      try {
        const res = await fetch("/api/status");
        const data = await res.json();

        const badge = document.getElementById("statusBadge");
        badge.textContent = data.isProcessing ? "RUNNING (5s)" : "IDLE";
        badge.className = "badge " + (data.isProcessing ? "badge-run" : "badge-idle");
        document.getElementById("queueCount").textContent = data.queuedCount;

        const logBox = document.getElementById("logBox");
        if (data.logs && data.logs.length > 0) {
          logBox.innerHTML = data.logs
            .map((l) => {
              const detailStr = l.details ? " | " + JSON.stringify(l.details) : "";
              return `<div class="log-${l.level}">[${l.timestamp.split("T")[1].replace("Z", "")}] [${l.level}] ${l.message}${detailStr}</div>`;
            })
            .join("");
        }
      } catch (e) {
        // Ignore transient polling drops
      }
    }

    setInterval(refreshStatus, 2000);
    refreshStatus();
  </script>
</body>
</html>
