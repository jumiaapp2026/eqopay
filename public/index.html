<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EQOPAY STK Push Dispatcher</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 640px; background: #1e293b; padding: 24px; border-radius: 12px; border: 1px solid #334155; }
    h1 { margin-top: 0; font-size: 1.35rem; color: #38bdf8; }
    label { display: block; margin-top: 14px; margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }
    textarea, input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #f8fafc; font-size: 0.95rem; }
    textarea { min-height: 130px; resize: vertical; }
    .row { display: flex; gap: 12px; }
    .row > div { flex: 1; }
    button { margin-top: 18px; width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    button:disabled { background: #475569; cursor: not-allowed; }
    .status-bar { margin-top: 16px; font-size: 0.9rem; color: #94a3b8; }
    .log-box { margin-top: 14px; background: #020617; border: 1px solid #334155; border-radius: 8px; padding: 12px; max-height: 280px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; }
    .log-item { padding: 6px 0; border-bottom: 1px solid #1e293b; }
    .log-item:last-child { border-bottom: none; }
    .SENT { color: #4ade80; }
    .FAILED, .ERROR { color: #f87171; }
  </style>
</head>
<body>
  <div class="container">
    <h1>EQOPAY STK Push Dispatcher (5s Interval)</h1>

    <label for="numbers">Mobile Numbers (one per line or comma-separated)</label>
    <textarea id="numbers" placeholder="0712345678&#10;254798765432&#10;0110123456"></textarea>

    <div class="row">
      <div>
        <label for="amount">Amount (KES)</label>
        <input type="number" id="amount" value="100" min="1" />
      </div>
      <div>
        <label for="prefix">Reference Prefix</label>
        <input type="text" id="prefix" value="ORDER" />
      </div>
    </div>

    <button id="startBtn" onclick="startBatch()">Start STK Push Queue</button>

    <div class="status-bar" id="statusText">Idle — Ready to send.</div>
    <div class="log-box" id="logBox">No logs yet.</div>
  </div>

  <script>
    let pollTimer = null;

    async function startBatch() {
      const raw = document.getElementById('numbers').value;
      const amount = document.getElementById('amount').value;
      const referencePrefix = document.getElementById('prefix').value;

      const numbers = raw
        .split(/[\n,]+/)
        .map(s => s.trim())
        .filter(Boolean);

      if (numbers.length === 0) {
        alert('Enter at least one mobile number.');
        return;
      }

      const btn = document.getElementById('startBtn');
      btn.disabled = true;
      document.getElementById('statusText').textContent = 'Starting batch...';

      try {
        const res = await fetch('/api/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ numbers, amount, referencePrefix })
        });
        const data = await res.json();

        if (!res.ok) {
          alert(data.error || 'Failed to start batch');
          btn.disabled = false;
          return;
        }

        if (pollTimer) clearInterval(pollTimer);
        pollTimer = setInterval(fetchStatus, 2000);
        fetchStatus();
      } catch (err) {
        alert('Error connecting to server: ' + err.message);
        btn.disabled = false;
      }
    }

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const state = await res.json();

        document.getElementById('statusText').textContent = state.running
          ? `Running: ${state.processed} / ${state.total} processed (5s delay between requests)...`
          : `Finished: ${state.processed} / ${state.total} processed.`;

        const logBox = document.getElementById('logBox');
        if (state.logs.length > 0) {
          logBox.innerHTML = state.logs
            .map(l => `<div class="log-item"><span class="${l.status}">[${l.status}]</span> #${l.index} (${l.msisdn}) - ${l.detail}</div>`)
            .join('');
          logBox.scrollTop = logBox.scrollHeight;
        }

        if (!state.running && pollTimer) {
          clearInterval(pollTimer);
          pollTimer = null;
          document.getElementById('startBtn').disabled = false;
        }
      } catch (err) {
        console.error('Status poll error:', err);
      }
    }
  </script>
</body>
</html>
